<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投资组合 · LinkX Capital 星连资本</title>
  <link rel="icon" href="assets/portfolio/favicon.png">
  <meta name="description" content="LinkX Capital 投资组合公司索引。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FAF8F4;
      --bg-warm: #F2EBE0;
      --card: #FFFDF9;
      --border: #DDD5CA;
      --border-light: #EAE4DC;
      --text: #1C1917;
      --text-soft: #44403C;
      --text-muted: #78716C;
      --text-light: #A8A29E;
      --purple: #660874;
      --purple-mid: #8B3A9A;
      --purple-soft: #B07CC0;
      --purple-pale: #E8D5EE;
      --purple-wash: #F3EAF6;
      --font-serif: "Instrument Serif", "Noto Serif SC", Georgia, serif;
      --font-sans: "Instrument Sans", Inter, system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --max: 1320px;
      --px: clamp(22px, 5.6vw, 76px);
      --header-h: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font: inherit
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--px)
    }

    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--purple-mid);
      z-index: 999;
      transition: width .1s linear
    }

    header.site-header {
      position: sticky;
      top: 0;
      z-index: 300;
      background: rgba(250, 248, 244, .84);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      border-bottom: 1px solid var(--border-light)
    }

    .nav {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      height: var(--header-h);
      padding: 0 clamp(20px, 4vw, 48px)
    }

    .brand-logo {
      display: inline-flex !important;
      align-items: center !important;
      gap: 13px !important;
      color: var(--text) !important;
      text-decoration: none !important;
      white-space: nowrap !important;
    }

    .brand-logo .brand-mark {
      width: 50px !important;
      height: 34px !important;
      object-fit: contain !important;
      display: block !important;
      flex: 0 0 auto !important;
    }

    .brand-logo .brand-lockup {
      display: grid !important;
      gap: 1px !important;
      line-height: 1 !important;
    }

    .brand-logo .brand-cn {
      font-family: var(--font-sans) !important;
      font-size: 20px !important;
      font-weight: 700 !important;
      letter-spacing: 0.03em !important;
    }

    .brand-logo .brand-en {
      display: block !important;
      font-family: var(--font-sans) !important;
      font-size: 11.5px !important;
      font-weight: 700 !important;
      letter-spacing: 0.045em !important;
      text-transform: uppercase !important;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(18px, 2.4vw, 34px);
      color: var(--text-muted)
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--text-light)
    }

    .lang-toggle button {
      background: none;
      border: 0;
      padding: 2px 4px;
      color: var(--text-light);
      cursor: pointer
    }

    .lang-toggle button.active,
    .lang-toggle button:hover {
      color: var(--purple)
    }

    .menu-toggle {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      min-height: 40px;
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer
    }

    .menu-toggle-mark {
      display: grid;
      gap: 5px;
      width: 34px
    }

    .menu-toggle-mark span {
      display: block;
      height: 1px;
      background: currentColor;
      transform-origin: right center;
      transition: transform .25s ease
    }

    .menu-toggle:hover .menu-toggle-mark span:first-child {
      transform: scaleX(.64)
    }

    .menu-toggle:hover .menu-toggle-mark span:last-child {
      transform: scaleX(1.18)
    }

    .menu-toggle-text {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .07em;
      text-transform: uppercase
    }

    body.menu-open {
      overflow: hidden
    }

    .menu-overlay {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(720px, 50vw);
      z-index: 500;
      color: var(--bg);
      background: linear-gradient(90deg, rgba(250, 248, 244, .035) 1px, transparent 1px), linear-gradient(0deg, rgba(250, 248, 244, .03) 1px, transparent 1px), linear-gradient(135deg, #151012 0%, #21161E 52%, #2A162F 100%);
      background-size: 96px 96px, 96px 96px, auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity .28s ease, transform .28s ease, visibility 0s linear .28s;
      box-shadow: -28px 0 70px rgba(28, 25, 23, .22);
      overflow: auto
    }

    .menu-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
      transition-delay: 0s
    }

    .menu-overlay::before {
      content: "LinkX";
      position: absolute;
      right: -.08em;
      bottom: -.28em;
      font-family: var(--font-serif);
      font-size: clamp(130px, 24vw, 360px);
      line-height: 1;
      color: rgba(250, 248, 244, .045);
      pointer-events: none
    }

    .menu-shell {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 0 clamp(22px, 3vw, 40px) 28px
    }

    .menu-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      border-bottom: 1px solid rgba(250, 248, 244, .12)
    }

    .menu-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(250, 248, 244, .48)
    }

    .menu-label span {
      color: var(--purple-pale)
    }

    .menu-close {
      position: relative;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 1px solid rgba(250, 248, 244, .22);
      color: var(--bg);
      cursor: pointer
    }

    .menu-close span {
      position: absolute;
      width: 18px;
      height: 1px;
      background: currentColor
    }

    .menu-close span:first-child {
      transform: rotate(45deg)
    }

    .menu-close span:last-child {
      transform: rotate(-45deg)
    }

    .menu-grid {
      padding: clamp(34px, 6vh, 56px) 0
    }

    .menu-primary {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(250, 248, 244, .16)
    }

    .menu-primary a {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 16px;
      align-items: baseline;
      padding: clamp(12px, 1.8vh, 18px) 0;
      border-bottom: 1px solid rgba(250, 248, 244, .16);
      color: rgba(250, 248, 244, .9)
    }

    .menu-primary .menu-num {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      color: rgba(232, 213, 238, .54)
    }

    .menu-primary strong {
      font-family: var(--font-serif);
      font-size: clamp(30px, 3vw, 44px);
      font-weight: 400;
      line-height: 1.02
    }

    .menu-primary em {
      font-family: var(--font-mono);
      font-size: 11px;
      font-style: normal;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(250, 248, 244, .35)
    }

    .menu-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(250, 248, 244, .12);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(250, 248, 244, .42)
    }

    .hero {
      position: relative;
      padding: clamp(86px, 10vw, 148px) 0 clamp(42px, 6vw, 76px);
      overflow: hidden;
      background: radial-gradient(circle at 78% 12%, rgba(176, 124, 192, .24), transparent 28%), radial-gradient(ellipse at 6% 88%, rgba(235, 225, 213, .72), transparent 44%), var(--bg)
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 1px;
      background: var(--border)
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .6fr);
      gap: clamp(40px, 7vw, 94px);
      align-items: center
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 18px;
      display: block
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(48px, 7vw, 92px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: .88
    }

    .hero-copy {
      max-width: 34ch;
      color: var(--text-soft);
      font-size: clamp(16px, 1.25vw, 18px);
      line-height: 1.85;
      justify-self: end
    }

    .hero-stats {
      display: grid;
      grid-template-columns: 1fr
    }

    .hero-stat {
      padding: 0
    }

    .hero-stat:last-child {
      border-right: 0
    }

    .hero-stat strong {
      display: block;
      font-family: var(--font-serif);
      font-size: clamp(44px, 5vw, 68px);
      font-weight: 400;
      color: var(--purple);
      line-height: 1
    }

    .hero-stat span {
      display: block;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: clamp(16px, 1.4vw, 20px);
      line-height: 1.55
    }

    .toolbar-shell {
      position: sticky;
      top: var(--header-h);
      z-index: 80;
      background: rgba(242, 235, 224, .9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border)
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 18px var(--px)
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .view-tab,
    .filter-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      height: 38px;
      padding: 0 15px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: all .2s ease
    }

    .view-tab:hover,
    .filter-btn:hover {
      border-color: var(--purple-soft);
      color: var(--purple)
    }

    .view-tab.active,
    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff
    }

    section {
      padding: clamp(64px, 8vw, 116px) 0
    }

    .section-alt {
      background: var(--bg-warm)
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 34px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border)
    }

    .section-head h2 {
      font-family: var(--font-serif);
      font-size: clamp(34px, 4.2vw, 62px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.03em
    }

    .section-head p {
      max-width: 46ch;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: minmax(340px, auto);
      gap: 11px;
      width: 100%;
    }

    .featured-card {
      --brand: var(--purple);
      min-height: 340px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 14%, var(--card)), var(--card));
      transition: transform .28s ease, box-shadow .28s ease, background .28s ease, min-height .34s ease, max-height .34s ease;
      position: relative;
      overflow: hidden;
      text-align: left;
      color: inherit;
      cursor: pointer;
      outline: none;
      display: flex;
      flex-direction: column;
    }

    .featured-card.big-card {
      grid-column: span 2;
    }

    .featured-card.medium-card {
      grid-column: span 1;
    }

    .featured-card.small-card {
      min-height: 190px;
      height: calc(50% - 6px);
    }

    .companies-grid-vertical {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      height: 100%;
      grid-column: span 1;
    }

    .featured-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, color-mix(in srgb, var(--brand) 58%, #1c1917), color-mix(in srgb, var(--brand) 18%, #fffdf9));
      opacity: 0;
      transition: opacity .32s ease;
      z-index: 1;
    }

    .featured-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 78% 16%, rgba(255, 255, 255, 0.55), transparent 24%);
      opacity: 0.18;
      transition: transform .32s ease, opacity .32s ease;
      z-index: 1;
    }

    .featured-card:hover,
    .featured-card:focus-visible,
    .featured-card.is-open {
      transform: translateY(-4px);
      box-shadow: 0 26px 54px rgba(28, 25, 23, 0.14);
      z-index: 2;
    }

    .featured-card:hover::before,
    .featured-card:focus-visible::before,
    .featured-card.is-open::before {
      opacity: 0.93;
    }

    .featured-card:hover::after,
    .featured-card.is-open::after {
      transform: scale(1.08);
      opacity: 0.3;
    }

    .featured-card-inner {
      position: relative;
      z-index: 2;
      min-height: inherit;
      padding: 26px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      color: var(--text);
      height: 100%;
      width: 100%;
      box-sizing: border-box;
    }

    .small-card .featured-card-inner {
      padding: 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 100%;
      min-height: auto;
    }

    .featured-card:hover .featured-card-inner,
    .featured-card:focus-visible .featured-card-inner,
    .featured-card.is-open .featured-card-inner {
      color: #fffdf9;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
    }

    .logo-box {
      width: min(46%, 220px);
      height: 96px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      overflow: hidden;
      justify-self: center;
      align-self: center;
      box-shadow: none;
      border-radius: 2px;
    }

    .small-card .logo-box {
      width: 60px;
      height: 40px;
      margin: 0;
      flex-shrink: 0;
    }

    .big-card .logo-box {
      width: 35%;
      height: 96px;
    }

    .featured-card[data-slug="infrawaves"] .logo-box {
      transform: translateY(-14px);
    }

    /* Responsive Logo Image Sizing Constraints per Card Size */
    .logo-box img,
    .logo-box iframe,
    .logo-box object {
      object-fit: contain;
      filter: saturate(0.92);
      transition: max-width 0.28s ease, max-height 0.28s ease;
    }

    /* Big Card: highly refined, spacious centered logo */
    .big-card .logo-box img,
    .big-card .logo-box iframe,
    .big-card .logo-box object {
      max-width: 48%;
      max-height: 56%;
    }

    /* Medium Card: balanced standard logo layout */
    .medium-card .logo-box img,
    .medium-card .logo-box iframe,
    .medium-card .logo-box object {
      max-width: 60%;
      max-height: 52%;
    }

    /* Small Card: optimized and snug logo fit */
    .small-card .logo-box img,
    .small-card .logo-box iframe,
    .small-card .logo-box object {
      max-width: 78%;
      max-height: 64%;
    }

    .logo-fallback {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      color: var(--purple);
      letter-spacing: 0.04em;
      transition: color 0.28s ease;
    }

    .featured-card:hover .logo-fallback,
    .featured-card.is-open .logo-fallback {
      color: var(--purple-pale);
    }

    .small-card .logo-fallback {
      font-size: 14px;
    }

    .company-index {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--purple);
      text-transform: uppercase;
    }

    .featured-card:hover .company-index,
    .featured-card.is-open .company-index {
      color: rgba(255, 253, 249, 0.72);
    }

    .card-main {
      align-self: stretch;
      margin-top: auto;
    }

    .small-card .card-main {
      margin-top: 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-self: center;
    }

    .featured-card h3 {
      font-family: var(--font-serif);
      font-size: clamp(24px, 2.5vw, 36px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .small-card h3 {
      font-size: 16px !important;
      line-height: 1.2;
    }

    .featured-card .en-name {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .featured-card:hover .en-name,
    .featured-card.is-open .en-name {
      color: rgba(255, 253, 249, 0.68);
    }

    .track-name {
      display: block;
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .small-card .track-name {
      margin-top: 4px;
      font-size: 9px;
    }

    .featured-card:hover .track-name,
    .featured-card.is-open .track-name {
      color: rgba(255, 253, 249, 0.76);
    }

    .card-detail {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.34s ease;
    }

    .featured-card.is-open .card-detail {
      grid-template-rows: 1fr;
    }

    .card-detail-inner {
      overflow: hidden;
    }

    .card-detail p {
      margin-top: 14px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 253, 249, 0.28);
      color: rgba(255, 253, 249, 0.82);
      font-size: 14px;
      line-height: 1.72;
    }

    .expand-cue {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--purple);
    }

    .featured-card:hover .expand-cue,
    .featured-card.is-open .expand-cue {
      color: #fffdf9;
    }

    .expand-cue::after {
      content: "+";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 14px;
      font-family: var(--font-sans);
      font-weight: 500;
      line-height: 18px;
      letter-spacing: 0;
      text-align: center;
    }

    .featured-card.is-open .expand-cue::after {
      content: "−";
    }

    /* Subtitle Link for Full Portfolio or BP */
    .portfolio-contact-link {
      display: inline-block;
      margin-left: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      text-transform: uppercase;
    }

    .portfolio-contact-link a {
      color: var(--purple);
      text-decoration: underline;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .portfolio-contact-link a:hover {
      color: var(--purple-mid);
    }

    /* Jump Link below 展开详情 in Card View */
    .card-website-link {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--purple-soft);
      text-decoration: underline;
      margin-top: 4px;
      transition: color 0.2s ease, opacity 0.2s ease;
      z-index: 5;
      position: relative;
    }

    .featured-card:hover .card-website-link,
    .featured-card.is-open .card-website-link {
      color: #fffdf9;
      opacity: 0.85;
    }

    .featured-card:hover .card-website-link:hover,
    .featured-card.is-open .card-website-link:hover {
      color: #fff;
      opacity: 1;
    }

    /* Full-Viewport Company Detail Page Styling */
    body.company-detail-open .hero,
    body.company-detail-open .toolbar-shell,
    body.company-detail-open .view-switch-shell,
    body.company-detail-open .companies-panel,
    body.company-detail-open .join {
      display: none;
    }

    .company-detail {
      display: block;
      background: var(--bg);
      padding: clamp(72px, 9vw, 132px) 0;
    }

    .company-detail[hidden] {
      display: none;
    }

    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 44px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--purple);
      border-bottom: 1px solid currentColor;
      padding-bottom: 5px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .detail-back:hover {
      color: var(--purple-mid);
      transform: translateX(-4px);
    }

    .detail-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      gap: clamp(36px, 7vw, 92px);
      align-items: start;
    }

    @media screen and (max-width: 900px) {
      .detail-shell {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }

    .detail-main h1 {
      font-family: var(--font-serif);
      font-size: clamp(58px, 9vw, 122px);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.045em;
    }

    .detail-en {
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .detail-desc {
      margin-top: 34px;
      max-width: 760px;
      color: var(--text-soft);
      font-size: clamp(20px, 2vw, 30px);
      line-height: 1.35;
    }

    .detail-body {
      margin-top: 34px;
      max-width: 780px;
      color: var(--text-soft);
      font-size: 16px;
      line-height: 1.85;
    }

    .detail-side {
      position: sticky;
      top: calc(var(--header-h) + 34px);
      border-top: 1px solid var(--border);
      display: grid;
    }

    .detail-logo {
      min-height: 220px;
      padding: 20px 0;
      display: grid;
      place-items: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--purple-wash), var(--card));
    }

    .detail-logo .logo-box {
      width: min(92%, 560px);
      min-height: 190px;
      height: auto;
      padding: 22px;
      border: 0;
      background: rgba(255, 253, 249, 0.78);
      display: grid;
      place-items: center;
      overflow: visible;
      box-shadow: inset 0 0 0 1px rgba(28, 25, 23, 0.07);
      border-radius: 4px;
    }

    .detail-logo .logo-box img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 190px;
      object-fit: contain;
      filter: saturate(0.92);
    }

    .detail-meta {
      display: grid;
      gap: 22px;
      padding: 26px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-meta-item {
      display: grid;
      gap: 8px;
    }

    .detail-meta-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .detail-meta-value {
      font-size: 17px;
      color: var(--text);
      font-weight: 500;
    }

    .detail-website {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
      height: 48px;
      background: var(--purple);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .13em;
      text-transform: uppercase;
      border-radius: 4px;
      font-weight: 500;
      transition: transform 0.22s ease, opacity 0.22s ease;
      box-shadow: 0 8px 24px rgba(102, 8, 116, 0.12);
    }

    .detail-website:hover {
      transform: translateY(-2px);
      opacity: 0.92;
      color: #fff;
    }

    /* Accordion Auto Height for Small Cards inside Grid */
    .featured-card.small-card {
      min-height: 190px;
      max-height: 190px;
      height: calc(50% - 6px);
      flex-shrink: 0;
    }

    .featured-card.small-card.is-open {
      min-height: 340px;
      max-height: 560px;
      height: auto !important;
      flex-grow: 1;
    }

    .featured-card.small-card.is-open .en-name {
      display: block;
    }

    .featured-card.small-card .featured-card-inner {
      padding: 18px 22px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      height: 100%;
    }

    .featured-card.small-card .logo-box {
      width: 72px;
      height: 40px;
      margin: 0;
      justify-self: flex-start;
      align-self: center;
    }

    .featured-card.small-card h3 {
      font-size: 16px !important;
      line-height: 1.2;
    }

    .featured-card.small-card .en-name {
      display: block;
    }

    .featured-card.small-card .track-name {
      margin-top: 2px;
      font-size: 9px;
    }

    .companies-grid-vertical {
      min-height: 390px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: min-height .34s ease, height .34s ease;
    }

    .companies-grid-vertical.has-open-card {
      height: auto;
      min-height: 540px;
      align-self: start;
    }

    .companies-grid-vertical.has-open-card .featured-card.small-card {
      height: auto;
    }

    .companies-grid-vertical:has(.is-open) {
      height: auto !important;
    }

    .companies-panel {
      display: block;
      padding-top: 24px;
    }

    .companies-panel[hidden] {
      display: none
    }

    /* Two-column layout for List View */
    .list-layout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: start;
    }

    @media (min-width: 992px) {
      .list-layout-grid {
        grid-template-columns: 1fr 340px;
      }
    }

    .list-main-col {
      min-width: 0;
    }

    .list-side-col {
      position: sticky;
      top: calc(var(--header-h) + 40px);
    }

    .contact-sidebar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 36px 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .contact-sidebar-card:hover {
      border-color: var(--purple-soft);
      box-shadow: 0 20px 40px rgba(102, 8, 116, 0.08);
    }

    .contact-sidebar-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--purple);
    }

    .contact-sidebar-title {
      font-family: var(--font-serif);
      font-size: 24px;
      line-height: 1.3;
      font-weight: 400;
      color: var(--text);
    }

    .contact-sidebar-desc {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-soft);
    }

    .contact-sidebar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--purple);
      color: #fff !important;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      border-radius: 4px;
      transition: all 0.2s ease;
      margin-top: 8px;
      width: fit-content;
    }

    .contact-sidebar-btn:hover {
      background: var(--purple-mid);
      box-shadow: 0 4px 12px rgba(102, 8, 116, 0.15);
    }

    .company-list {
      border-top: 1px solid var(--border)
    }

    .company-row {
      display: grid;
      grid-template-columns: minmax(230px, 1.15fr) minmax(200px, .85fr) minmax(160px, .55fr) 42px;
      gap: 22px;
      align-items: center;
      padding: 24px 16px;
      border-bottom: 1px solid var(--border);
      transition: background .22s ease, color .22s ease, box-shadow .22s ease;
      cursor: pointer
    }

    .company-row:hover {
      background: linear-gradient(90deg, var(--purple) 0%, #332435 100%);
      color: #fffdf9;
      box-shadow: inset 4px 0 0 var(--purple-soft)
    }

    .company-row h3 {
      font-family: var(--font-serif);
      font-size: clamp(24px, 2.4vw, 36px);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -.02em
    }

    .company-row .en-name {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--text-light);
      transition: color .22s ease
    }

    .company-row:hover .en-name {
      color: rgba(255, 253, 249, .62)
    }

    .track-pill {
      display: inline-flex;
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(250, 248, 244, .48);
      transition: color .22s ease, border-color .22s ease, background .22s ease
    }

    .track-cell {
      display: grid;
      gap: 8px;
      justify-items: start;
    }

    .row-subtag {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-light);
      line-height: 1.4;
      transition: color .22s ease;
    }

    .company-row:hover .track-pill {
      color: #fffdf9;
      border-color: rgba(232, 213, 238, .64);
      background: rgba(232, 213, 238, .12)
    }

    .company-row:hover .row-subtag {
      color: rgba(255, 253, 249, .68)
    }

    .row-link {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--purple);
      border-bottom: 1px solid currentColor;
      padding-bottom: 4px;
      word-break: break-word;
      transition: color .22s ease
    }

    .company-row:hover .row-link {
      color: #fffdf9
    }

    .row-arrow {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--purple);
      font-family: var(--font-serif);
      font-size: 32px;
      line-height: 1;
      justify-self: end;
      transition: transform .22s ease, color .22s ease
    }

    .company-row:hover .row-arrow {
      transform: translateX(4px);
      color: var(--purple-pale)
    }

    .empty-state {
      display: none;
      padding: 60px 0;
      text-align: center;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--text-muted)
    }

    .empty-state.is-visible {
      display: block
    }

    .join {
      background: radial-gradient(circle at 82% 12%, rgba(176, 124, 192, .24), transparent 34%), linear-gradient(180deg, #4A3D49 0%, #332435 38%, #211722 72%, #171218 100%);
      color: var(--bg);
      padding: clamp(62px, 7vw, 92px) 0;
      position: relative;
      overflow: hidden
    }

    .join::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(250, 248, 244, .06) 1px, transparent 1px), linear-gradient(0deg, rgba(250, 248, 244, .042) 1px, transparent 1px);
      background-size: 112px 112px;
      opacity: .18
    }

    .join-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 34px;
      align-items: end
    }

    .join h2 {
      font-family: var(--font-serif);
      font-size: clamp(38px, 5vw, 72px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.035em
    }

    .join p {
      margin-top: 16px;
      color: rgba(250, 248, 244, .68);
      max-width: 54ch
    }

    .join a {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(250, 248, 244, .56);
      font-size: 18px
    }

    @media screen and (max-width: 1024px) {
      .featured-grid {
        grid-auto-rows: 300px;
        grid-template-columns: repeat(3, 1fr);
      }

      .companies-grid-vertical {
        display: contents;
      }

      .featured-card.small-card {
        grid-column: span 1;
        height: auto;
        min-height: 190px;
        max-height: none;
      }

      .small-card .featured-card-inner {
        min-height: 190px;
      }
    }

    @media screen and (max-width: 768px) {
      .featured-grid {
        grid-auto-rows: 220px;
        grid-template-columns: repeat(2, 1fr);
      }

      .featured-card.big-card {
        grid-column: span 2;
      }

      .featured-card.small-card {
        min-height: 190px;
        max-height: none;
        height: auto;
      }

      .small-card .featured-card-inner {
        min-height: 190px;
      }
    }

    @media screen and (max-width: 567px) {
      .featured-grid {
        grid-auto-rows: 180px;
        grid-template-columns: 1fr;
      }

      .featured-card.big-card {
        grid-column: span 1;
      }
    }

    @media(max-width:1180px) {
      .company-row {
        grid-template-columns: minmax(180px, 1fr) minmax(170px, .72fr) minmax(140px, .58fr) 34px;
        gap: 16px
      }
    }

    @media(max-width:860px) {
      :root {
        --header-h: 66px
      }

      .nav {
        height: 66px;
        padding: 0 20px
      }

      .brand-mark {
        width: 36px;
        height: 24px;
        font-size: 10px
      }

      .brand-cn {
        font-size: 17px
      }

      .brand-en,
      .menu-toggle-text {
        display: none
      }

      .menu-overlay {
        width: 100vw
      }

      .hero-grid,
      .join-inner {
        grid-template-columns: 1fr
      }

      .hero h1 {
        font-size: clamp(38px, 12vw, 68px)
      }

      .hero-stats {
        grid-template-columns: 1fr
      }

      .hero-stat {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding-left: 0
      }

      .hero-stat:last-child {
        border-bottom: 0;
        padding-left: 0
      }

      .toolbar {
        justify-content: flex-start;
        padding: 14px 20px
      }

      .view-tabs {
        justify-content: flex-start
      }

      .company-row {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 22px 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 0
      }

      section {
        padding: 58px 0
      }
    }

      }
    }

    function setLang(lang) { const sx = window.scrollX, sy = window.scrollY; state.lang = lang; document.documentElement.dataset.lang = lang; document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'; localStorage.setItem('linkx.lang', lang); const d = dict(); $$('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (d[k]) el.innerHTML = d[k] }); $$('[data-set-lang]').forEach(b => b.classList.toggle('active', b.dataset.setLang === lang)); renderAll(); renderCompanyDetail(); requestAnimationFrame(() => window.scrollTo(sx, sy)) }

    function renderFeatured() {
      const grid = $('#featuredGrid');
      let html = '';
      const skipped = new Set();

      for (let i = 0; i < DATA.companies.length; i++) {
        if (skipped.has(i)) continue;

        const c = DATA.companies[i];
        const indexStr = String(i + 1).padStart(2, '0');

        if (i === 2 || i === 10) {
          const cNext = DATA.companies[i + 1];
          const indexNextStr = String(i + 2).padStart(2, '0');
          skipped.add(i + 1);

          html += `
        <div class="companies-grid-vertical">
          <article class="featured-card small-card" data-slug="${c.slug}" style="--brand:${BRAND[c.slug] || '#660874'}" role="button" tabindex="0" aria-expanded="false" aria-label="${esc(companyName(c))}" onclick="toggleCardAccordion(this)">
            <span class="featured-card-inner">
              <span class="card-top">
                <span class="company-index">${indexStr}</span>
                <span class="card-top-right" style="display: flex; flex-direction: column; align-items: flex-end;">
                  <span class="expand-cue">${dict().expand}</span>
                  ${c.website ? `<a class="card-website-link" href="${esc(c.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${isEn() ? 'Website ↗' : '访问官网 ↗'}</a>` : ''}
                </span>
              </span>
              <span class="logo-box">${logo(c)}</span>
              <span class="card-main"><h3>${esc(companyName(c))}</h3><span class="en-name">${esc(isEn() ? c.name : c.nameEn)}</span><span class="track-name">${esc(companyDesc(c))}</span><span class="card-detail"><span class="card-detail-inner"><p>${esc(companyDetail(c))}</p></span></span></span>
            </span>
          </article>
          <article class="featured-card small-card" data-slug="${cNext.slug}" style="--brand:${BRAND[cNext.slug] || '#660874'}" role="button" tabindex="0" aria-expanded="false" aria-label="${esc(companyName(cNext))}" onclick="toggleCardAccordion(this)">
            <span class="featured-card-inner">
              <span class="card-top">
                <span class="company-index">${indexNextStr}</span>
                <span class="card-top-right" style="display: flex; flex-direction: column; align-items: flex-end;">
                  <span class="expand-cue">${dict().expand}</span>
                  ${cNext.website ? `<a class="card-website-link" href="${esc(cNext.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${isEn() ? 'Website ↗' : '访问官网 ↗'}</a>` : ''}
                </span>
              </span>
              <span class="logo-box">${logo(cNext)}</span>
              <span class="card-main"><h3>${esc(companyName(cNext))}</h3><span class="en-name">${esc(isEn() ? cNext.name : cNext.nameEn)}</span><span class="track-name">${esc(companyDesc(cNext))}</span><span class="card-detail"><span class="card-detail-inner"><p>${esc(companyDetail(cNext))}</p></span></span></span>
            </span>
          </article>
        </div>
      `;
        } else {
          const sizeClass = (i === 0 || i === 8 || i === 12 || i === 13) ? 'big-card' : 'medium-card';
          html += `
        <article class="featured-card ${sizeClass}" data-slug="${c.slug}" style="--brand:${BRAND[c.slug] || '#660874'}" role="button" tabindex="0" aria-expanded="false" aria-label="${esc(companyName(c))}" onclick="toggleCardAccordion(this)">
          <span class="featured-card-inner">
            <span class="card-top">
              <span class="company-index">${indexStr}</span>
              <span class="card-top-right" style="display: flex; flex-direction: column; align-items: flex-end;">
                <span class="expand-cue">${dict().expand}</span>
                ${c.website ? `<a class="card-website-link" href="${esc(c.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${isEn() ? 'Website ↗' : '访问官网 ↗'}</a>` : ''}
              </span>
            </span>
            <span class="logo-box">${logo(c)}</span>
            <span class="card-main"><h3>${esc(companyName(c))}</h3><span class="en-name">${esc(isEn() ? c.name : c.nameEn)}</span><span class="track-name">${esc(companyDesc(c))}</span><span class="card-detail"><span class="card-detail-inner"><p>${esc(companyDetail(c))}</p></span></span></span>
          </span>
        </article>
      `;
        }
      }

      grid.innerHTML = html;
      $$('#featuredGrid .featured-card').forEach(card => card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } });
    }

    function renderFilters() { const groups = ['all', ...new Set(DATA.companies.map(c => c.group))]; $('#filters').innerHTML = groups.map(g => `<button class="filter-btn ${state.filter === g ? 'active' : ''}" data-filter="${esc(g)}">${g === 'all' ? dict().all : esc(displayGroup(g))}</button>`).join(''); $$('#filters .filter-btn').forEach(btn => btn.onclick = () => { state.filter = btn.dataset.filter; renderAll() }) }
    function matches(c) { return state.filter === 'all' || c.group === state.filter }
    function renderList() {
      const items = DATA.companies.filter(matches);
      $('#companyList').innerHTML = items.map(c => `<a class="company-row" href="${detailHref(c)}"><div><h3>${esc(companyName(c))}</h3><div class="en-name">${esc(isEn() ? c.name : c.nameEn)}</div></div><div class="track-cell"><span class="track-pill">${esc(displayGroup(c.group))}</span><span class="row-subtag">${esc(companyDesc(c))}</span></div><span class="row-link">${dict().profile}</span><span class="row-arrow" aria-hidden="true">→</span></a>`).join('');
      $('#emptyState').classList.toggle('is-visible', items.length === 0);

      $$('#companyList .company-row').forEach(row => {
        row.onclick = e => {
          e.preventDefault();
          const href = row.getAttribute('href');
          history.pushState(null, '', href);
          renderCompanyDetail({ scrollToTop: true });
        };
      });
    }
    function renderAll() { $('#companyCount').textContent = '70+'; renderFilters(); renderFeatured(); renderList() }

    $$('[data-set-lang]').forEach(btn => btn.onclick = () => setLang(btn.dataset.setLang));

    function switchView(view, options = {}) { const sx = window.scrollX, sy = window.scrollY; state.view = view; $$('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== view); $$('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view)); if (!options.fromNavigation) history.replaceState(null, '', '#' + view); if (options.preserveScroll !== false) requestAnimationFrame(() => window.scrollTo(sx, sy)) }
    $$('.view-tab').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));

    const menu = $('#siteMenu');
    function setMenu(open) { document.body.classList.toggle('menu-open', open); menu.classList.toggle('is-open', open); menu.setAttribute('aria-hidden', open ? 'false' : 'true'); $('[data-menu-open]').setAttribute('aria-expanded', open ? 'true' : 'false') }
    $('[data-menu-open]').onclick = () => setMenu(true);
    $('[data-menu-close]').onclick = () => setMenu(false);
    $$('[data-menu-link]').forEach(a => a.onclick = () => setMenu(false));

    document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false) });
    const bar = $('#progressBar');
    window.addEventListener('scroll', () => { const h = document.documentElement.scrollHeight - window.innerHeight; bar.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + '%' }, { passive: true });
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
    $$('.reveal').forEach(el => io.observe(el));

    function handleNavigation(options = {}) {
      renderCompanyDetail({ scrollToTop: !!options.scrollToTop });
      const hash = location.hash.replace('#', '') || 'featured';
      if (hash === 'list' || hash === 'featured') {
        switchView(hash, { fromNavigation: true, preserveScroll: false });
      }
    }
    window.addEventListener('popstate', () => handleNavigation({ scrollToTop: true }));
    window.addEventListener('hashchange', () => handleNavigation());

    setLang(state.lang === 'en' ? 'en' : 'zh');
    handleNavigation({ scrollToTop: !!currentCompany() });
  </script>

</body>

</html>
